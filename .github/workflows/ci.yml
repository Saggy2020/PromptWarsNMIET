name: PantryPilot CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Safety Evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEMO_MODE: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (unit + API tests)
        run: python -m pytest -q

      - name: Run Deterministic Allergen Safety Eval (zero false negatives gate)
        run: python -m evals.run_safety_suite

      - name: Run Adversarial Prompt Injection Benchmark
        run: python -m evals.run_injection_suite

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Next.js Type Check & Build
        run: npm run build
